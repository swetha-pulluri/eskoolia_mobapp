name: eskoolia_mobapp
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+8

environment:
  sdk: ^3.12.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  

  # Icons
  cupertino_icons: ^1.0.8

  # Home screen ambient background particles (school-themed .lottie files
  # in assets/animations/)
  lottie: ^3.1.0

  # State Management & DI
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Networking
  dio: ^5.7.0
  pretty_dio_logger: ^1.3.1
  # Sets an explicit Content-Type on the School Info logo upload's
  # MultipartFile (a transitive dep of dio; declared directly since we import
  # it ourselves in school_info_remote_datasource.dart)
  http_parser: ^4.0.2

  # Local Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # File Picking (Administration attachments, Attendance import dialog)
  file_picker: ^11.0.2

  # Saves generated exports/downloads to the real, user-visible Downloads
  # location on Android (MediaStore) and iOS, instead of an app-private
  # folder no file manager shows — see `file_download_io.dart`.
  media_store_plus: ^0.1.3

  # Native camera capture (Student Enroll "Take photo" — the mobile
  # equivalent of the frontend's in-browser getUserMedia camera modal;
  # opens the OS camera app directly instead, the standard native pattern)
  image_picker: ^1.1.2

  # Client-side photo compression before upload (Student Enroll photo) — the
  # mobile equivalent of the frontend's canvas-based resize-before-upload,
  # so a normal phone-camera photo (often 3-8MB) still fits the backend's
  # upload size limit instead of being rejected outright.
  image: ^4.3.0

  # Resolves the OS's real Downloads directory (Android) / a visible
  # Documents directory (iOS), so School Tenancy's export/download buttons
  # land somewhere the user can actually find the file, instead of the
  # invisible OS temp directory.
  path_provider: ^2.1.6

  # PDF generation + native print/share dialog (Documents Studio: Generate &
  # Print — the mobile equivalent of web's `window.open()` + `popup.print()`)
  pdf: ^3.11.1
  printing: ^5.13.1

  # Native share/download sheet for generated files (Admissions: Class
  # Workspace + Analytics CSV export — the mobile equivalent of web's
  # Blob + `<a download>` click)
  share_plus: ^10.1.4

  # Code Generation
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Navigation
  go_router: ^14.2.7

  # Launching external URLs (School Tenancy: View ERP / Impersonate handoff)
  url_launcher: ^6.3.1

  # Utilities
  equatable: ^2.0.5
  logger: ^2.4.0
  intl: ^0.19.0

  # Fonts (matching frontend: Plus Jakarta Sans from Google Fonts)
  google_fonts: ^6.2.1

  # Settings > School Info: campus location map (mirrors web's Leaflet +
  # OpenStreetMap tiles in SchoolLocationMap.tsx)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Settings > School Info: "Use My Current Location" (mirrors web's
  # navigator.geolocation)
  geolocator: ^13.0.1

  # Settings > School Info: brand-color swatch picker dialog (mirrors web's
  # native <input type="color">, which has no Flutter built-in equivalent)
  flutter_colorpicker: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Lints
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.12
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/
    - assets/icons/teacher/
  
  
  # Note: Fonts loaded via google_fonts package (Plus Jakarta Sans)
  # Matches frontend: https://fonts.google.com/specimen/Plus+Jakarta+Sans
  # Weights: 300, 400, 400i, 500, 600, 700, 800

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
