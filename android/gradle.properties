# This builtInKotlin flag was added by the Flutter template. Left at the
# template's default `false`: AGP is pinned below 9 (see android/settings.gradle.kts),
# so AGP's built-in-Kotlin mode never comes into play — every plugin (file_picker,
# share_plus, flutter_plugin_android_lifecycle, ...) applies the classic
# `org.jetbrains.kotlin.android` plugin itself, exactly as before the AGP 9
# migration. Setting this to `true` under AGP 9 broke flutter_plugin_android_lifecycle
# (a transitive dep of image_picker), which still applies that plugin
# unconditionally — AGP 9 + built-in Kotlin actively rejects that as redundant.
android.builtInKotlin=false
